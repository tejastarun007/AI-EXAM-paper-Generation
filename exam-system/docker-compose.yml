version: '3.9'
services:
  backend:
    build: ./backend
    ports: ['8000:8000']
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASS}@postgres:5432/examdb
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OLLAMA_HOST=http://ollama:11434
      - PYTHONUNBUFFERED=1
    volumes: ['./backend:/app', './data:/app/data', './wallets:/app/wallets', './contracts:/app/contracts']
    depends_on: [chromadb, ollama, postgres]

  frontend:
    build: ./frontend
    ports: ['3000:80']
    depends_on: [backend]

  chromadb:
    image: chromadb/chroma:0.5.3
    ports: ['8001:8000']
    volumes: ['chroma_data:/chroma/chroma']

  ollama:
    image: ollama/ollama:0.3.6
    ports: ['11434:11434']
    volumes: ['ollama_data:/root/.ollama']

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: examdb
      POSTGRES_USER: '${DB_USER}'
      POSTGRES_PASSWORD: '${DB_PASS}'
    ports:
      - '5432:5432'
    volumes: ['pg_data:/var/lib/postgresql/data']

volumes:
  chroma_data:
  ollama_data:
  pg_data:
